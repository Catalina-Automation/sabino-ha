# Sabino: Catalina Automation's Sonora design system (tokens, aliases, HA mapping, radii, spacing,
# motion, shadows, Bubble Card hooks, card-mod font import) with color
# values of the Sabino palette (Catalina-Automation/sabino-theme).
# modes.light = Sabino Day, modes.dark = Sabino Night, so HA's Auto
# mode follows the device light/dark setting.
# Raw token NAMES are kept (clay/sage/agave/dusk/bloom/sand/ink) so existing
# dashboard styles (var(--brand), var(--sand-200), ...) keep working.
# Fonts are Google Fonts substitutes (Newsreader / Hanken Grotesk / JetBrains Mono), loaded via @import
# below.
Sabino:
  card-mod-theme: Sabino
  modes:
    light:
      # ---- Raw tokens (exposed as CSS custom properties so dashboard
      #      `styles:` / card-mod blocks can reference them directly) ----
      clay-50: "#FBF6EC"
      clay-100: "#F5E3DC"
      clay-200: "#EFD6CC"
      clay-300: "#D88068"
      clay-400: "#B85A3E"
      clay-500: "#B0563B"
      clay-600: "#A44D33"
      clay-700: "#8F4129"
      sage-50: "#E6EAE2"
      sage-100: "#DCE3DA"
      sage-200: "#B6C4B8"
      sage-300: "#90A595"
      sage-400: "#6B8772"
      sage-500: "#2F4A3A"
      sage-600: "#243A2D"
      sage-700: "#22332A"
      agave-100: "#C3DDD7"
      agave-300: "#7FAFA6"
      agave-500: "#2F5A54"
      agave-700: "#244741"
      dusk-100: "#C0CFDD"
      dusk-300: "#93AAC0"
      dusk-500: "#2F4459"
      dusk-700: "#243445"
      bloom-100: "#F0E1E5"
      bloom-300: "#DCB4BC"
      bloom-500: "#9C6B7A"
      bloom-700: "#7C4E5E"
      sand-50: "#FFFCF5"
      sand-100: "#FBF6EC"
      sand-200: "#F6EBD5"
      sand-300: "#DFDACD"
      sand-400: "#D6D0C0"
      sand-500: "#A6ACA6"
      sand-600: "#5F6761"
      ink-700: "#5C645E"
      ink-800: "#3D4540"
      ink-900: "#0F1612"
      grad-sunset: "linear-gradient(120deg, #D4A24C 0%, #9C6B7A 100%)"
      grad-warmth: "linear-gradient(120deg, #D4A24C 0%, #B85A3E 100%)"
      grad-cool: "linear-gradient(120deg, #93AAC0 0%, #2F5A54 100%)"
      grad-meadow: "linear-gradient(120deg, #B6C4B8 0%, #6B8772 100%)"
      grad-dawn: "linear-gradient(140deg, #FBF6EC 0%, #F6EBD5 60%, #F0DFBF 100%)"
      radius-xs: "6px"
      radius-sm: "10px"
      radius-md: "16px"
      radius-lg: "22px"
      radius-xl: "30px"
      radius-pill: "999px"
      shadow-sm: "0 1px 2px rgba(20, 32, 22, 0.06)"
      shadow-md: "0 4px 14px rgba(20, 32, 22, 0.08)"
      shadow-lg: "0 14px 34px rgba(20, 32, 22, 0.12)"
      shadow-glow: "0 6px 22px rgba(212, 162, 76, 0.35)"
      shadow-inset: "inset 0 1px 3px rgba(20, 32, 22, 0.10)"
      blur-panel: "blur(16px)"
      scrim: "rgba(15, 22, 18, 0.38)"
      ease-out: cubic-bezier(0.22, 0.61, 0.36, 1)
      ease-soft: cubic-bezier(0.4, 0.0, 0.2, 1)
      dur-fast: "140ms"
      dur-base: "240ms"
      dur-slow: "420ms"
      font-display: "'Newsreader', Georgia, serif"
      font-ui: "'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif"
      font-mono: "'JetBrains Mono', ui-monospace, monospace"

      # ---- Semantic aliases (design-system names) ----
      surface-app: var(--sand-100)
      surface-card: var(--sand-50)
      surface-sunken: var(--sand-200)
      surface-inverse: var(--ink-900)
      text-strong: var(--ink-900)
      text-body: var(--ink-800)
      text-muted: var(--ink-700)
      text-subtle: var(--sand-600)
      text-on-clay: var(--clay-50)
      text-inverse: var(--sand-50)
      brand: var(--clay-500)
      brand-hover: var(--clay-600)
      brand-press: var(--clay-700)
      accent: var(--sage-400)
      accent-hover: var(--sage-500)
      border-soft: "#E4DFD1"
      border-strong: "#D6D0C0"
      ring: "rgba(184, 90, 62, 0.32)"
      ok: var(--sage-500)
      warn: "#8F6320"
      alert: "#A8492C"
      info: var(--dusk-500)
      on-glow: "#D4A24C"
      off-dim: var(--sand-400)

      # ---- HA core variable mapping ----
      primary-color: var(--brand)
      accent-color: var(--brand)
      primary-background-color: var(--surface-app)
      secondary-background-color: var(--surface-sunken)
      card-background-color: var(--surface-card)
      divider-color: var(--border-soft)
      primary-text-color: var(--text-strong)
      secondary-text-color: var(--text-muted)
      text-primary-color: var(--text-on-clay)
      disabled-text-color: var(--sand-500)
      state-icon-color: var(--text-muted)
      state-icon-active-color: var(--brand)
      state-active-color: var(--brand)
      label-badge-red: var(--alert)
      label-badge-green: var(--ok)
      label-badge-blue: var(--info)
      label-badge-yellow: var(--warn)
      # Status colors read by gauge severity, tile/badge state colors and
      # alert cards. Without these, HA falls back to its stock bright
      # red/green/yellow, which clashes with the Sabino palette.
      success-color: var(--ok)
      warning-color: var(--warn)
      error-color: var(--alert)
      info-color: var(--info)
      ha-card-background: var(--surface-card)
      ha-card-border-radius: var(--radius-lg)
      ha-card-border-width: "1px"
      ha-card-border-color: var(--border-soft)
      ha-card-box-shadow: var(--shadow-md)
      ha-dialog-border-radius: var(--radius-xl)
      mdc-dialog-scrim-color: var(--scrim)
      switch-checked-button-color: var(--accent)
      switch-checked-track-color: var(--sage-200)
      switch-unchecked-button-color: var(--sand-50)
      switch-unchecked-track-color: var(--off-dim)
      paper-slider-knob-color: var(--brand)
      paper-slider-active-color: var(--brand)
      sidebar-background-color: var(--surface-card)
      sidebar-icon-color: var(--text-muted)
      sidebar-selected-icon-color: var(--primary-text-color)
      sidebar-selected-text-color: var(--primary-text-color)
      primary-font-family: var(--font-ui)
      ha-font-family-body: var(--font-ui)
      ha-font-family-heading: var(--font-display)
      ha-font-family-code: var(--font-mono)

      # ---- Bubble Card global hooks (cascade to every bubble-card instance) ----
      bubble-border-radius: var(--radius-lg)
      bubble-main-background-color: var(--surface-card)
      bubble-secondary-background-color: var(--surface-sunken)
      bubble-accent-color: var(--brand)
      bubble-box-shadow: var(--shadow-md)
      bubble-border: "1px solid var(--border-soft)"

